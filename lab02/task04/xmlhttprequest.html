<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task04</title>
</head>
<body>
    <p id="name"></p>

    <script>
        const url = '/api/name';
        const xhr = new XMLHttpRequest();
        
        xhr.open('GET', url, true); 
        console.log('open');

        xhr.onload = () => {
            if (xhr.status == 200) {
                document.getElementById('name').textContent = xhr.responseText;
                console.log('200 onload')
            } else {
                document.getElementById('name').textContent = 'error loading data';
                console.log('error onload')
            }
        }

        xhr.send();
        console.log('send');


    </script>
</body>
</html>
