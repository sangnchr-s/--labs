<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task05</title>
</head>

<body>
    <p id="name"></p>

    <script>

        fetch('/api/name') 
            .then(res => {
                res.text();
                console.log('res.text');
            })

            .then(data => {
                document.getElementById('name').textContent = data
                console.log('data');
            }) 
            .catch(() => {
                document.getElementById('name').textContent = 'error loading';
            })

    </script>
</body>

</html>
